name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run functional checks
        run: python -m unittest discover -s tests -v
